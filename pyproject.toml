[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edgejev"
version = "0.1.0"
description = "在自己的设备上跑 Jev 式的类型化决策：ONNX + INT8，运行时不需要 torch，支持 Linux / macOS / Windows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "yzfly", email = "zphyix@gmail.com" }]
keywords = ["jev", "system-one", "onnx", "quantization", "cpu-inference", "calibrated-probabilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.20",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
# 只有「把 HF checkpoint 转成 ONNX」这一步需要，转完就可以卸掉
build = ["torch>=2.0", "transformers>=4.45", "safetensors>=0.4", "laya>=0.3.0", "onnxconverter-common>=1.14", "onnx>=1.15"]
# playjev 后端走 torch 运行时（Qwen3.5 的线性注意力层导不出 ONNX）
vlm = ["torch>=2.0", "torchvision", "transformers>=4.45", "pillow", "accelerate"]
# 训练
train = ["torch>=2.0", "transformers>=4.45", "safetensors>=0.4"]

[project.urls]
Homepage = "https://github.com/yzfly/edgejev"
Repository = "https://github.com/yzfly/edgejev"
Issues = "https://github.com/yzfly/edgejev/issues"

[project.scripts]
edgejev = "edgejev.cli:main"

[tool.setuptools.packages.find]
include = ["edgejev*"]
